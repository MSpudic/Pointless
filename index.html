<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d22"><link rel="icon" href="data:,">
<title>Pointless Challenge · School Edition</title>
<style>
:root{--navy:#080d22;--panel:#152344;--border:#354b72;--light:#ecf4ff;--muted:#aabde2;--gold:#ffd279;--cyan:#60dcf3;--mint:#54e5b2;--red:#ff7185;--shadow:0 14px 42px #0005}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 10%,#233c74 0,transparent 37%),radial-gradient(circle at 0 80%,#14295b 0,transparent 40%),var(--navy);color:var(--light);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #6179a4;background:#2a4274;color:#fff;border-radius:10px;padding:11px 16px;font-weight:700;transition:.15s}
button:hover:not(:disabled){background:#395890;transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(120deg,#ffe29d,#eab45b);border:0;color:#18213a}
button.primary:hover:not(:disabled){background:#ffdb8e}
button.danger{background:#743248;border-color:#a84d65}
button.ghost{background:transparent;border-color:#425d8c}
button.small{font-size:.85rem;padding:8px 11px}
button.x{padding:2px 8px;font-size:.8rem;border-radius:7px;background:transparent;border-color:#5a6f97}
input,select{width:100%;padding:11px 12px;border-radius:9px;background:#0d1a35;border:1px solid #5471a0;color:#fff;outline:none}
input[type=checkbox],input[type=radio]{width:18px;height:18px;padding:0;accent-color:#ffd279}
input:focus,select:focus{border-color:#ffd279;box-shadow:0 0 0 2px #ffd27925}
input::placeholder{color:#7c91b6}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid #293d63;background:#081329b5;flex-wrap:wrap}
.brand{font-size:1.12rem;font-weight:950;letter-spacing:.13em;color:var(--gold)}
.brand span{color:#fff;font-weight:500;letter-spacing:.02em;font-size:.72rem}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
main{max-width:1420px;margin:auto;padding:24px}
.eyebrow{font-size:.8rem;letter-spacing:.17em;color:var(--gold);font-weight:800;text-transform:uppercase}
.hero{font-size:clamp(2.1rem,5vw,4.9rem);margin:8px 0 10px;line-height:1.05;letter-spacing:-.04em}
.sub{color:var(--muted);font-size:1.03rem;line-height:1.5}
.panel{background:linear-gradient(150deg,#19294b,#101c38);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-lobby{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.center{text-align:center}
.mt{margin-top:18px}.mb{margin-bottom:18px}
.tag{display:inline-block;border:1px solid #5e7299;background:#263b68;color:#d9e5ff;padding:5px 10px;border-radius:50px;font-size:.76rem;font-weight:800;letter-spacing:.04em}
.gold{color:var(--gold)}.muted{color:var(--muted)}.tiny{font-size:.77rem;color:var(--muted)}.help{font-size:.9rem;color:#a9bdde;line-height:1.48}
.section-title{font-size:1.3rem;font-weight:800;margin:0 0 12px}
.round-label{font-size:1rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-weight:900}
.question{font-weight:900;line-height:1.18;font-size:clamp(1.55rem,3vw,3.1rem);margin:10px 0 13px}
.question-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr{border:0;border-top:1px solid #435575;margin:16px 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.choice{padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:700}
.choice.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#3b4a6c}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.catgrid label{display:flex;gap:9px;align-items:center;background:#1f3258;border:1px solid #3f577e;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{background:#ffd279;color:#18213a;border-color:#ffd279}
/* lobby */
.qrbox{background:#fff;border-radius:16px;padding:14px;max-width:360px;margin:0 auto}
.qrbox svg{display:block;width:100%;height:auto}
.joincode{font-size:clamp(2.4rem,5vw,4rem);font-weight:950;letter-spacing:.18em;color:var(--gold);font-variant-numeric:tabular-nums}
.joinurl{font-size:.95rem;color:#dbe7ff;overflow-wrap:anywhere;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#22365d;border:1px solid #415b88;border-radius:30px;padding:7px 13px;font-weight:800;max-width:100%}.chip.newchip{animation:pop .45s both}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip.done{background:#173f43;border-color:#419a7c}.chip.off{opacity:.55}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}.chip .dot.offline{background:#7c8bab}
.bigcount{font-size:3rem;font-weight:950;color:var(--gold);line-height:1}
.warn{background:#4a2b1d;border:1px solid #b9733c;color:#ffd9b0;border-radius:12px;padding:12px 14px;font-size:.92rem;line-height:1.45}
.ok{background:#173f43;border:1px solid #419a7c;color:#c9ffe9;border-radius:12px;padding:10px 14px;font-size:.9rem}
/* timer */
.qhead{display:flex;justify-content:space-between;gap:22px;align-items:flex-start}.qhead>div:first-child{flex:1;min-width:0}
.timerbox{flex:none;text-align:center}.timerbox .row{justify-content:center;margin-top:8px;flex-wrap:nowrap}.timerbox select{width:auto;padding:7px 8px}
.bigtimer{font-size:clamp(2.8rem,6.5vw,5.6rem);font-weight:950;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigtimer.urgent{color:var(--red);animation:pulse 1s infinite}.bigtimer.done{color:var(--red)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.answer-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}
.answer-choice{background:#24375c;border:1px solid #425e8c;padding:13px 8px;min-height:56px;font-size:.95rem;overflow-wrap:anywhere;border-radius:10px;text-align:center;font-weight:700;display:flex;align-items:center;justify-content:center}
.progressbar{height:12px;border-radius:9px;background:#0d1a35;border:1px solid #3a5079;overflow:hidden}.progressbar div{height:100%;background:linear-gradient(90deg,#54e5b2,#ffd279);transition:width .4s}
/* review */
.rule{display:grid;grid-template-columns:1fr auto 190px 90px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #2f4265}
.rule strong{overflow-wrap:anywhere}.rule select,.rule input{padding:7px 8px}
/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.tile{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #33496f;background:#14223f;border-radius:13px;padding:11px 14px;min-height:66px;perspective:600px}
.tile .face{opacity:0;transform:rotateX(-80deg);transition:none;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.tile .hid{position:absolute;inset:0;display:grid;place-items:center;color:#4b628c;font-weight:900;letter-spacing:.2em}
.tile.shown .hid{display:none}
.tile.shown .face{opacity:1;transform:none}
.tile.shown.anim .face{transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.tile strong{display:block;overflow-wrap:anywhere;line-height:1.2}
.tile .who{font-size:.74rem;color:var(--muted);margin-top:3px}
.tile .sc{font-size:1.75rem;font-weight:950;color:var(--gold);font-variant-numeric:tabular-nums;flex:none;min-width:2.2ch;text-align:right}
.tile.found.shown{background:#4c3e31;border-color:#d9a94f}.tile.found.shown .who{color:#f3dba6}
.tile.zero.shown{border-color:var(--mint);box-shadow:0 0 22px #4affb655}.tile.zero.shown .sc{color:var(--mint)}
.tile.unsaid.shown{opacity:.62}
.tile.wrongt.shown{background:#3a2233;border-color:#8a4560}.tile.wrongt .sc{color:var(--red);font-size:1.2rem}
.tile.current{outline:3px solid var(--gold);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* standings */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pod{background:#20335a;border:1px solid #45618a;border-radius:15px;padding:16px;text-align:center}.fresh .pod{animation:pop .5s both}
.pod.p1{border-color:var(--gold);box-shadow:0 0 30px #ffd27930}
.pod .rk{font-size:.8rem;letter-spacing:.14em;color:var(--gold);font-weight:900}
.pod .nm{font-size:1.4rem;font-weight:900;margin:6px 0;overflow-wrap:anywhere}
.pod .pts{font-size:2.4rem;font-weight:950;color:var(--gold);font-variant-numeric:tabular-nums}
.ranklist{columns:3 260px;column-gap:14px;margin-top:14px}
.rk-row{display:grid;grid-template-columns:2.6em 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:#1b2c4f;margin-bottom:6px;break-inside:avoid}.fresh .rk-row{animation:pop .4s both}
.rk-row.q{background:#4c3e31;border:1px solid #d9a94f}
.rk-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rk-row .t{font-weight:900;font-variant-numeric:tabular-nums}
.mv{font-size:.72rem;font-weight:900;min-width:2.6em;text-align:right}.mv.up{color:var(--mint)}.mv.down{color:var(--red)}.mv.same{color:#6f82a8}
.star{color:var(--mint);margin-left:4px;text-shadow:0 0 10px #4affb680}
/* final */
.reveal-layout{display:grid;grid-template-columns:200px 1fr;gap:27px;align-items:center;max-width:900px;margin:12px auto}
.tower{height:280px;border:3px solid #657dab;border-radius:22px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,transparent,transparent 27px,#31496b 28px,#31496b 29px),linear-gradient(180deg,#0e1d3a,#1e3357);box-shadow:inset 0 0 28px #07142c,0 0 30px #466da322}
.tower-fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(0deg,#d8832e,#f7d47f);transition:height 1.75s cubic-bezier(.18,.86,.27,1)}
.tower-scale{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding:10px;color:#fff;font-weight:900;text-shadow:1px 1px #000}
.biganswer{font-size:clamp(1.65rem,4vw,3.4rem);font-weight:900;overflow-wrap:anywhere}
.bigscore{font-size:clamp(4rem,9vw,8rem);font-weight:950;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.zero{color:var(--mint);text-shadow:0 0 30px #4affb665}.wrong{color:var(--red)}
.fcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcard{background:#1d3055;border:1px solid #45618a;border-radius:15px;padding:14px}
.fcard.lead{border-color:var(--gold)}
.fslot{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:9px;background:#132242;margin-top:7px;font-weight:800}
.fslot.cur{outline:2px solid var(--gold)}.fslot .s{font-variant-numeric:tabular-nums;color:var(--gold)}.fslot .s.z{color:var(--mint)}.fslot .s.w{color:var(--red)}
.final-entry{display:grid;grid-template-columns:1fr repeat(3,minmax(0,1fr));gap:8px;align-items:center;margin:10px 0}
.final-entry strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leader-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.leader-item{background:#20335a;border:1px solid #45618a;border-radius:13px;padding:14px}
.leader-item strong{display:block;font-size:1.1rem}.leader-item .value{font-size:2rem;color:#ffce75;font-weight:900}
/* private host panel */
.private{border-style:dashed;border-color:#7d93bb}
.ptable{width:100%;border-collapse:collapse;margin-bottom:12px}.ptable td{padding:6px 8px;border-bottom:1px solid #2f4265;font-size:.9rem}.ptable td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.keychips{display:flex;flex-wrap:wrap;gap:6px}.keychip{background:#22365d;border:1px solid #415b88;border-radius:8px;padding:4px 8px;font-size:.82rem}.keychip b{color:var(--gold);margin-left:4px}.keychip.k0{border-color:var(--mint)}.keychip.k0 b{color:var(--mint)}.keychip.k100{opacity:.6}.keychip.k100 b{color:var(--red)}
/* general */
.footer{padding:14px;text-align:center;color:#97a9ca;font-size:.76rem}
.modalbg{position:fixed;inset:0;z-index:10;background:#040915e8;display:grid;place-items:center;padding:20px}
.modal{width:min(720px,100%);max-height:90vh;overflow-y:auto;background:#142343;border:1px solid #61779d;border-radius:18px;padding:24px}
.hidden{display:none!important}
.toast{position:fixed;bottom:16px;right:16px;z-index:15;background:#e4f4ff;color:#112043;border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);font-weight:800;max-width:400px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.display-only{display:none}
body.display .display-only{display:block}body.display span.display-only{display:inline-block}
body.display .host-only,body.display [data-action],body.display .hostbtn,body.display #toast{display:none!important}
/* phone */
body.player header{padding:10px 14px}body.player .brand{font-size:.95rem}body.player main{max-width:560px;padding:16px}
body.player .footer{display:none}
.pcard{background:linear-gradient(150deg,#19294b,#101c38);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.pq{font-size:1.35rem;font-weight:900;line-height:1.25;margin:8px 0 14px}
.popt{display:grid;gap:9px}
.popt button{text-align:left;padding:15px 16px;font-size:1.02rem;background:#24375c;border-color:#425e8c}
.popt button.sel{background:#6d542b;border-color:#ffd279;box-shadow:inset 0 0 0 1px #ffd279}
.pbig{font-size:4.5rem;font-weight:950;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.pstat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pstat div{background:#1d3055;border-radius:12px;padding:12px;text-align:center}.pstat b{display:block;font-size:1.7rem;color:var(--gold)}
.ptimer{font-size:1.4rem;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}.ptimer.urgent{color:var(--red)}
.sent{background:#173f43;border:1px solid #419a7c;border-radius:12px;padding:12px;margin-top:12px;font-weight:800;color:#c9ffe9;overflow-wrap:anywhere}
.netpill{font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:30px;background:#173f43;color:#c9ffe9;border:1px solid #419a7c}.netpill.bad{background:#4a2b1d;color:#ffd9b0;border-color:#b9733c}
@media(max-width:900px){.answer-board{grid-template-columns:repeat(3,1fr)}.grid2,.grid-lobby{grid-template-columns:1fr}.reveal-layout{grid-template-columns:145px 1fr}.tower{height:230px}.rule{grid-template-columns:1fr auto;}.podium{grid-template-columns:1fr}.fcards{grid-template-columns:1fr}}
@media(max-width:600px){header{padding:12px}main{padding:13px}.answer-board{grid-template-columns:repeat(2,1fr)}.reveal-layout{grid-template-columns:110px 1fr;gap:10px}.tower{height:190px}.panel{padding:14px}.final-entry{grid-template-columns:1fr}.bigscore{font-size:4rem}.qhead{flex-direction:column;align-items:stretch}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<main id="app"></main>
<footer class="footer">Estimated game scores, not real survey data. Phones connect through the free PeerJS relay; no accounts and nothing stored online.</footer>
<div id="toast" class="toast hidden"></div>

<script>'use strict';
// =====================================================================
//  POINTLESS CHALLENGE · SCHOOL EDITION (multiplayer)
//  One file, three modes:
//    host    (default)          – the teacher's laptop; runs the game
//    display (#display)         – clean audience window for the projector
//    player  (?join=CODE)       – a student's phone
//  Phones talk to the host through the free PeerJS relay (WebRTC).
// =====================================================================
const P=new URLSearchParams(location.search);
const MODE=(P.has('join')||P.has('play'))?'player':location.hash==='#display'?'display':'host';
const PEER_PREFIX='cbc-pointless-';
const STORE='pointless_mp_v2', PSTORE='pointless_player_v2';
const TIMER=30, MAX_PLAYERS=60;
const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
// ?peerhost=host:port points at a private PeerJS server (used for offline testing).
// Optional TURN relay (e.g. a free ExpressTURN account) for networks that block device-to-device links.
function turnSettings(){let t=null;if(MODE==='host')t=state&&state.settings&&state.settings.turn;else{try{let raw=P.get('ice');if(raw)t=JSON.parse(atob(raw))}catch(e){}if(!t){try{t=(JSON.parse(localStorage.getItem(PSTORE))||{}).turn}catch(e){}}}return t&&t.h&&t.u&&t.p?t:null}
function iceConfig(){let list=[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}];let t=turnSettings();if(t){let h=String(t.h).replace(/^(turns?:|https?:\/\/)/,'').replace(/[:\/].*$/,'');list.unshift({urls:[`turn:${h}:3478?transport=udp`,`turn:${h}:3478?transport=tcp`,`turns:${h}:443?transport=tcp`],username:t.u,credential:t.p})}return {iceServers:list}}
function peerOptions(){let h=P.get('peerhost');if(!h)return {debug:0,config:iceConfig()};let [host,port]=h.split(':');return {host,port:+port||9000,path:'/',secure:false,debug:0,config:{iceServers:[]}}}

// ---------- helpers
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘'`]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ').replace(/^the /,'').replace(/\bst\b/g,'saint');
function lev(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
// Exact match first; written answers then tolerate small spelling slips when one listed answer is clearly closest.
function findAnswer(question,input){let n=norm(input);if(!n)return null;let names=it=>[it.a,...(it.aliases||[])].map(norm);let exact=question.items.find(it=>names(it).includes(n));if(exact||question.format!=='written'||question.exact)return exact||null;let max=n.length>=9?2:n.length>=5?1:0;if(!max)return null;let best=null,bestD=max+1,tie=false;for(const it of question.items){let d=Math.min(...names(it).map(x=>lev(x,n)));if(d<bestD){best=it;bestD=d;tie=false}else if(d===bestD&&d<=max)tie=true}return best&&!tie?best:null}
const qById=id=>BANK.find(x=>x.id===id)||FINALS.find(x=>x.id===id);
const ord=n=>{let s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,18);
function toast(m){let t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),2800)}
function openModal(h){$('modal').innerHTML=h;$('modalbg').classList.remove('hidden')}
function closeModal(){$('modalbg').classList.add('hidden')}
function btn(text,action,cls='',attr=''){return `<button class="${cls}" data-action="${action}" ${attr}>${text}</button>`}
function qrSvg(text){try{let qr=qrcode(0,'M');qr.addData(text);qr.make();return qr.createSvgTag({cellSize:6,margin:3,scalable:true,alt:'QR code to join the game'})}catch(e){return '<p style="color:#000">QR unavailable</p>'}}
let audioCtx;
function sound(type='beep'){if(MODE!=='host'||!state||!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;let ctx=audioCtx||(audioCtx=new C());if(ctx.state==='suspended')ctx.resume();let notes=type==='success'?[523,659,784,1047]:type==='wrong'?[220,165]:type==='zero'?[523,784,1047,1319]:type==='tick'?[880]:type==='join'?[660,880]:type==='tile'?[587]:[440];notes.forEach((hz,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.115;o.type=type==='wrong'?'sawtooth':'sine';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(type==='tile'?.04:.075,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.21);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.22)})}catch(e){}}

// =====================================================================
//  GAME STATE (host is the authority; display mirrors it)
// =====================================================================
const newCode=()=>Array.from({length:5},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
const initial=()=>({v:2,phase:'setup',settings:{length:10,cats:CATS.slice(),timerLength:TIMER,autoClose:true,joinBase:''},code:newCode(),players:[],plan:[],qIndex:0,done:0,answers:{},open:false,rulings:{},results:{},shuffled:{},revealStep:0,revealPlaying:false,prevRanks:{},finalists:[],finalQuestion:'final-s',finalAnswers:{},finalRulings:{},finalResults:{},finalShown:0,finalAnimAt:0,fopen:false,seconds:TIMER,timerRunning:false,sound:true});
let state=initial();
if(MODE==='host'){try{let s=JSON.parse(localStorage.getItem(STORE));if(s&&s.v===2&&s.players&&s.phase)state={...initial(),...s,settings:{...initial().settings,...s.settings},timerRunning:false}}catch(e){}}
let snapshots=[];
const active=()=>state.players.filter(p=>!p.removed);
const byId=id=>state.players.find(p=>p.id===id);
const isFinalPhase=()=>state.phase.startsWith('final')||state.phase==='champion';
function currentQ(){return isFinalPhase()?qById(state.finalQuestion):qById(state.plan[state.qIndex])}
function compareHistories(a,b){let x=[...a].sort((u,v)=>u-v),y=[...b].sort((u,v)=>u-v);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]??100)!==(y[i]??100))return (x[i]??100)-(y[i]??100)}return 0}
function leaderboard(list=active()){return list.slice().sort((a,b)=>a.total-b.total||compareHistories(a.history,b.history)||a.name.localeCompare(b.name))}
const rankIn=(list,p)=>1+list.filter(o=>o.total<p.total).length;
const stars=p=>p.history.filter(x=>x===0).length;
const starHtml=p=>'<span class="star" title="Pointless answer">★</span>'.repeat(stars(p));
function optionsFor(qq){if(!state.shuffled[qq.id]){state.shuffled[qq.id]=shuffle(qq.items.map(x=>x.a))}return state.shuffled[qq.id]}
// Totals as they stood before the current question's scores were added (used while the board is still revealing).
function shownPlayers(){if(state.phase!=='reveal'||revealDone())return active();return active().map(p=>{let r=state.results[p.id];return r&&p.history.length===state.done?{...p,total:p.total-r.s,history:p.history.slice(0,-1)}:p})}

// ---------- persistence, undo, sync
let pushTimer=null;
function persist(){if(MODE!=='host')return;try{localStorage.setItem(STORE,JSON.stringify({...state,timerRunning:false}))}catch(e){}clearTimeout(pushTimer);pushTimer=setTimeout(()=>{pushState();broadcast()},60)}
function snapshot(){snapshots.push(JSON.stringify(state));if(snapshots.length>30)snapshots.shift()}
function change(fn,{undo=true}={}){if(undo)snapshot();fn();persist();render()}

// =====================================================================
//  QUESTION PLAN
// =====================================================================
function buildPlan(len,cats){let pools={};cats.forEach(c=>pools[c]=shuffle(BANK.filter(b=>b.cat===c)));let order=shuffle(cats),plan=[],guard=0;while(plan.length<len&&guard++<500){let progressed=false;for(const c of order){if(plan.length>=len)break;let next=pools[c].shift();if(next){plan.push(next.id);progressed=true}}if(!progressed)break;order=shuffle(order)}
// keep a healthy mix: avoid three of the same format in a row where possible
for(let i=2;i<plan.length;i++){let f=id=>qById(id).format;if(f(plan[i])===f(plan[i-1])&&f(plan[i])===f(plan[i-2])){let j=plan.findIndex((id,k)=>k>i&&f(id)!==f(plan[i]));if(j>0)[plan[i],plan[j]]=[plan[j],plan[i]]}}return plan}
const usedIds=()=>new Set(state.plan);
function finalAvailable(f){return !f.base||!state.plan.slice(0,state.done).includes(f.base)}

// =====================================================================
//  SCORING
// =====================================================================
function resultFor(qq,raw,rulings){raw=String(raw||'').trim();if(!raw)return {a:'No answer',s:100,none:true};let m=findAnswer(qq,raw);if(m)return {a:m.a,s:m.s,known:true,raw};let r=rulings[norm(raw)];if(r){if(r.mode==='match'){let it=qq.items.find(i=>i.a===r.match);if(it)return {a:it.a,s:it.s,known:true,raw}}if(r.mode==='accept')return {a:raw,s:Math.max(0,Math.min(100,r.s|0)),known:false,accepted:true,raw}}return {a:raw,s:100,known:false,raw}}
// Written answers that are not in the list: the host decides on each one before the reveal.
function unmatchedGroups(final){let qq=currentQ();if(qq.format!=='written')return [];let raws=[];if(final)state.finalists.forEach(id=>(state.finalAnswers[id]||[]).forEach(a=>a&&raws.push({id,a})));else active().forEach(p=>{let a=state.answers[p.id]?.a;if(a)raws.push({id:p.id,a})});let g={};raws.forEach(({id,a})=>{if(findAnswer(qq,a))return;let k=norm(a);if(!k)return;(g[k]||(g[k]={key:k,text:a,ids:[]})).ids.push(id)});return Object.values(g).sort((a,b)=>b.ids.length-a.ids.length)}
// The reveal board: wrong answers first, then every correct answer from most to least popular.
function boardTiles(){let qq=currentQ(),res=state.results,ids=Object.keys(res);let who=f=>ids.filter(id=>f(res[id])).map(id=>byId(id)?.name||'?');let tiles=[];
 if(qq.format==='multi'){qq.items.filter(i=>i.s>=100).forEach(i=>tiles.push({kind:'wrongt',label:i.a,names:who(r=>r.a===i.a),s:100}))}
 let wrong=who(r=>!r.none&&r.s>=100&&!qq.items.some(i=>i.a===r.a&&i.s>=100)),none=who(r=>r.none);
 if(qq.format==='written'||wrong.length)tiles.push({kind:'wrongt',label:'Wrong answers',names:wrong,s:100,anon:true});
 if(none.length)tiles.push({kind:'wrongt',label:'No answer',names:none,s:100,anon:true});
 let ok=qq.items.filter(i=>i.s<100).map(i=>({kind:'ok',label:i.a,s:i.s,names:who(r=>r.known&&r.a===i.a)}));
 let extra={};ids.forEach(id=>{let r=res[id];if(r.accepted){let k=norm(r.a);(extra[k]||(extra[k]={kind:'ok',label:r.a,s:r.s,names:[],extra:true})).names.push(byId(id)?.name||'?')}});
 ok=ok.concat(Object.values(extra)).sort((a,b)=>b.s-a.s||b.names.length-a.names.length);return tiles.concat(ok)}
const revealDone=()=>state.phase==='reveal'&&!state.revealPlaying&&state.revealStep>=boardTiles().length;

// =====================================================================
//  HOST ACTIONS
// =====================================================================
function openLobby(){let s=state.settings;if(!s.cats.length)return toast('Pick at least one category');change(()=>{state.plan=buildPlan(s.length,s.cats);if(state.plan.length<s.length)toast(`Only ${state.plan.length} questions available in those categories`);state.phase='lobby'});startHostPeer()}
function startQuestion(){state.phase='collect';state.answers={};state.rulings={};state.results={};state.open=true;state.revealStep=0;state.revealPlaying=false;resetTimer(false)}
function closeAnswers(){if(state.phase!=='collect')return;change(()=>{state.open=false;state.timerRunning=false;clearInterval(tickInterval);state.phase='review'});sound('tick')}
function reopenAnswers(){change(()=>{state.open=true;state.phase='collect'})}
function startReveal(){change(()=>{let qq=currentQ(),lb=leaderboard();state.prevRanks={};lb.forEach(p=>state.prevRanks[p.id]=rankIn(lb,p));state.results={};active().forEach(p=>{let r=resultFor(qq,state.answers[p.id]?.a,state.rulings);state.results[p.id]=r;p.total+=r.s;p.history.push(r.s)});state.done++;state.phase='reveal';state.revealStep=0;state.revealPlaying=true});scheduleReveal()}
function nextQuestion(){change(()=>{state.qIndex++;startQuestion()})}
function toFinal(){change(()=>{let lb=leaderboard();state.finalists=lb.slice(0,2).map(p=>p.id);let f=FINALS.find(x=>x.id===state.finalQuestion);if(!f||!finalAvailable(f))state.finalQuestion=FINALS.find(finalAvailable).id;state.phase='finalists'})}
function startFinal(){if(state.finalists.length!==2||state.finalists[0]===state.finalists[1])return toast('Choose two different finalists');change(()=>{state.phase='finalcollect';state.finalAnswers={};state.finalRulings={};state.finalResults={};state.finalShown=0;state.fopen=true;resetTimer(false)})}
function lockFinal(){let qq=currentQ();for(const id of state.finalists){let vals=(state.finalAnswers[id]||[]).map(a=>String(a||'').trim());if(vals.filter(Boolean).length<3&&!confirm(`${byId(id).name} has fewer than three answers. Blank answers score 100. Continue?`))return}change(()=>{state.fopen=false;state.timerRunning=false;clearInterval(tickInterval);state.phase='finalreview'})}
function startFinalReveal(){change(()=>{let qq=currentQ();state.finalResults={};state.finalists.forEach(id=>{state.finalResults[id]=[0,1,2].map(j=>resultFor(qq,(state.finalAnswers[id]||[])[j],state.finalRulings))});state.finalShown=0;state.phase='finalreveal'})}
// Final reveal order alternates, starting with the second qualifier: B1, A1, B2, A2, B3, A3.
const finalOrder=()=>[0,1,2].flatMap(j=>[{id:state.finalists[1],j},{id:state.finalists[0],j}]);
function finalNext(){if(Date.now()-state.finalAnimAt<2300)return;if(state.finalShown>=6)return;change(()=>{state.finalShown++;state.finalAnimAt=Date.now()});let o=finalOrder()[state.finalShown-1],r=state.finalResults[o.id][o.j];setTimeout(()=>sound(r.s===0?'zero':r.s>=100?'wrong':'success'),1800)}
function finalScores(){return state.finalists.map(id=>({p:byId(id),vals:(state.finalResults[id]||[]).map(r=>r.s).sort((a,b)=>a-b)})).sort((a,b)=>compareHistories(a.vals,b.vals))}
function addPlayer(name,{id,manual=false}={}){name=cleanName(name);if(!name)return null;if(active().length>=MAX_PLAYERS){toast('Player limit reached');return null}let base=name,n=2;while(state.players.some(p=>!p.removed&&p.name.toLowerCase()===name.toLowerCase()))name=`${base} ${n++}`.slice(0,22);let p={id:id||('m'+Math.random().toString(36).slice(2,9)),name,total:100*state.done,history:Array(state.done).fill(100),manual,joinedAt:Date.now()};state.players.push(p);return p}
function removePlayer(id){let p=byId(id);if(!p)return;change(()=>{p.removed=true;state.finalists=state.finalists.filter(x=>x!==id)});let c=conns.get(id);if(c){try{c.send({t:'kicked'})}catch(e){}}}

// ---------- timer
let tickInterval;
const timerLen=()=>isFinalPhase()?Math.max(60,state.settings.timerLength||TIMER):(state.settings.timerLength||TIMER);
function resetTimer(update=true){clearInterval(tickInterval);state.timerRunning=false;state.seconds=timerLen();if(update){persist();updateHeader()}}
function timerToggle(){clearInterval(tickInterval);state.timerRunning=!state.timerRunning;if(state.timerRunning){if(state.seconds<=0)state.seconds=timerLen();tickInterval=setInterval(()=>{if(!state.timerRunning)return;if(state.seconds>0)state.seconds--;if(state.seconds>0&&state.seconds<=5)sound('tick');if(state.seconds<=0){state.timerRunning=false;clearInterval(tickInterval);sound('wrong');if(state.settings.autoClose&&state.phase==='collect'&&state.open){closeAnswers();toast('Time’s up · answers closed');return}toast('Time’s up!')}persist();updateHeader();sendTick()},1000)}persist();updateHeader();sendTick()}

// ---------- reveal autoplay
let revealTimer=null;
function scheduleReveal(){clearTimeout(revealTimer);if(MODE!=='host'||state.phase!=='reveal'||!state.revealPlaying)return;let tiles=boardTiles();let prev=tiles[state.revealStep-1];let d=state.revealStep===0?1100:prev.names.length?(prev.kind==='wrongt'?1300:2000):500;
 if(state.revealStep>=tiles.length){revealTimer=setTimeout(()=>{state.revealPlaying=false;persist();render();sound('success')},1700);return}
 revealTimer=setTimeout(()=>{state.revealStep++;let t=tiles[state.revealStep-1];persist();syncBoard(true);if(t.names.length)sound(t.kind==='wrongt'?'wrong':t.s===0?'zero':'tile');scheduleReveal()},d)}
function revealPause(){state.revealPlaying=!state.revealPlaying;persist();render();scheduleReveal()}
function revealSkip(){clearTimeout(revealTimer);state.revealStep=boardTiles().length;state.revealPlaying=false;persist();render()}

// =====================================================================
//  NETWORK · HOST SIDE (PeerJS)
// =====================================================================
let peer=null,conns=new Map(),netStatus={ok:false,msg:'Not started'},peerRetry=null,stuckPhones=0;
function startHostPeer(){if(MODE!=='host'||peer||typeof Peer==='undefined'){if(typeof Peer==='undefined'){netStatus={ok:false,msg:'Phone joining library failed to load.'};render()}return}
 netStatus={ok:false,msg:'Connecting to the relay…'};
 try{peer=new Peer(PEER_PREFIX+state.code,peerOptions())}catch(e){netStatus={ok:false,msg:'Could not start phone joining: '+e.message};render();return}
 peer.on('open',()=>{netStatus={ok:true,msg:'Ready for phones'};render()});
 peer.on('connection',c=>{setTimeout(()=>{if(!c.open){stuckPhones++;softRender()}},15000);c.on('data',d=>onPlayerData(c,d));c.on('close',()=>{for(const [id,x] of conns)if(x===c){conns.delete(id);softRender()}});c.on('error',()=>{})});
 peer.on('disconnected',()=>{netStatus={ok:false,msg:'Lost the relay. Reconnecting…'};render();setTimeout(()=>{try{peer&&!peer.destroyed&&peer.reconnect()}catch(e){}},1500)});
 peer.on('error',e=>{let t=e.type||'';if(t==='unavailable-id'){netStatus={ok:false,msg:'Re-opening this game code (a few seconds after a reload)…'};render();try{peer.destroy()}catch(x){}peer=null;clearTimeout(peerRetry);peerRetry=setTimeout(startHostPeer,4000);return}
  if(t==='peer-unavailable')return;
  if(['network','server-error','socket-error','socket-closed'].includes(t)){netStatus={ok:false,msg:'Cannot reach the relay server. Check the internet connection, or that the school network allows it. Retrying…'};render();try{peer.destroy()}catch(x){}peer=null;clearTimeout(peerRetry);peerRetry=setTimeout(startHostPeer,6000);return}
  if(t==='browser-incompatible'){netStatus={ok:false,msg:'This browser cannot host phone players. Use Chrome or Edge.'};render();return}
  netStatus={ok:false,msg:'Connection problem ('+t+'). Retrying…'};render()});
}
function onPlayerData(c,d){if(!d||typeof d!=='object')return;
 if(d.t==='hello'){let id=String(d.pid||'').slice(0,40);if(!id)return;let p=byId(id);
  if(p&&p.removed){try{c.send({t:'kicked'})}catch(e){}return}
  if(!p){if(state.phase==='setup'||state.phase==='champion'){try{c.send({t:'err',msg:'This game isn’t open for joining.'})}catch(e){}return}
   let name=cleanName(d.name);if(!name){try{c.send({t:'err',msg:'Please enter a name.'})}catch(e){}return}
   if(active().length>=MAX_PLAYERS){try{c.send({t:'err',msg:'The game is full.'})}catch(e){}return}
   p=addPlayer(name,{id});if(!p)return;sound('join');persist();softRender()}
  let old=conns.get(id);if(old&&old!==c){try{old.close()}catch(e){}}conns.set(id,c);c.send({t:'view',v:viewFor(id)});softRender();return}
 let id=[...conns].find(([,x])=>x===c)?.[0],p=id&&byId(id);if(!p||p.removed)return;
 if(d.t==='answer'){let qq=currentQ();if(state.phase!=='collect'||!state.open||d.qid!==qq.id){try{c.send({t:'err',msg:'Answers are closed.'})}catch(e){}return}let a=String(d.a||'').trim().slice(0,60);if(qq.format==='multi'&&!qq.items.some(i=>i.a===a))return;if(a)state.answers[id]={a,at:Date.now()};else delete state.answers[id];persist();softRender()}

}

 let v={phase:state.phase,name:p.name,count:active().length,seconds:state.seconds,run:state.timerRunning,n:state.qIndex+1,of:state.plan.length,total:me.total,rank:rankIn(sp,me),stars:stars(me)};
 if(['collect','review','reveal'].includes(state.phase)){let qq=currentQ();v.q={id:qq.id,prompt:qq.prompt,cat:qq.cat,format:qq.format,options:qq.format==='multi'?optionsFor(qq):null};v.open=state.open&&state.phase==='collect';v.my=state.answers[id]?.a||''}
 if(state.phase==='reveal'&&revealDone()||state.phase==='standings'){let r=state.results[id];if(r)v.result={a:r.none?'':r.a,s:r.s,none:!!r.none}}

 if(isFinalPhase()){let qq=currentQ();v.finalist=state.finalists.includes(id);v.fq=qq.prompt;v.fopen=state.fopen&&state.phase==='finalcollect';v.my3=state.finalAnswers[id]||[];v.finalists=state.finalists.map(f=>byId(f)?.name)}

 return v}

function renderFinalReview(){let groups=unmatchedGroups(true),qq=currentQ();return `<div class="row between mb"><span class="round-label">The Grand Final</span></div><div class="panel"><div class="eyebrow">Answers locked</div><h1 class="question">${esc(qq.prompt)}</h1><div class="display-only center" style="padding:30px 0"><div class="hero gold" style="font-size:clamp(2rem,4vw,3.4rem)">Six answers are in…</div></div>

function renderFinalReveal(){let qq=currentQ(),order=finalOrder(),k=state.finalShown,cur=order[k-1],r=cur&&state.finalResults[cur.id][cur.j];let animating=k>0&&Date.now()-state.finalAnimAt<2300;let lead=finalScores()[0];
 let slot=(id,j)=>{let idx=order.findIndex(o=>o.id===id&&o.j===j),shown=idx<k&&!(idx===k-1&&animating),rr=state.finalResults[id][j];return `<div class="fslot ${idx===k-1?'cur':''}"><span>${idx<k?esc(rr.none?'No answer':rr.a):'?????'}</span><span class="s ${shown?(rr.s===0?'z':rr.s>=100?'w':''):''}">${shown?(rr.s>=100?'✗ 100':rr.s):''}</span></div>`};
 return `<div class="row between mb"><span class="round-label">The Grand Final</span><span class="tag">${k} / 6 revealed</span></div><div class="panel"><h1 class="question center" style="font-size:clamp(1.3rem,2.4vw,2.3rem)">${esc(qq.prompt)}</h1>${cur?`<div class="reveal-layout"><div class="tower"><div id="towerFill" class="tower-fill" style="height:100%"></div><div class="tower-scale"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div></div><div><div class="eyebrow">${esc(byId(cur.id)?.name)} · Answer ${cur.j+1}</div><div class="biganswer mt">${esc(r.none?'No answer':r.a)}</div><div class="bigscore" id="bigScore">100</div><div class="muted" id="scoreNote">${animating?'Counting down…':''}</div></div></div>`:`<div class="center" style="padding:40px 0"><div class="hero gold" style="font-size:clamp(2rem,4vw,3.4rem)">Let’s see those answers…</div></div>`}
 <div class="fcards mt">${state.finalists.map(id=>`<div class="fcard"><strong style="font-size:1.15rem">${esc(byId(id)?.name)}</strong>${[0,1,2].map(j=>slot(id,j)).join('')}</div>`).join('')}</div>

function startFinalAnim(){let k=state.finalShown,o=finalOrder()[k-1];if(!o)return;let r=state.finalResults[o.id][o.j],left=2300-(Date.now()-state.finalAnimAt),el=$('towerFill'),num=$('bigScore'),note=$('scoreNote');let finish=()=>{if(num){num.textContent=r.s;num.className='bigscore '+(r.s===0?'zero':r.s>=100?'wrong':'')}if(el)el.style.height=r.s+'%';if(note)note.textContent=r.s===0?'POINTLESS!':r.s>=100?(r.none?'No answer':'Incorrect answer'):'Points scored'};if(left<=0){if(el)el.style.transition='none';finish();return}
 let t0=performance.now(),dur=Math.min(1750,left);requestAnimationFrame(()=>requestAnimationFrame(()=>{if(el)el.style.height=r.s+'%'}));let step=now=>{let kk=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-kk,3);if(num)num.textContent=Math.round(100-(100-r.s)*e);if(kk<1)requestAnimationFrame(step)};requestAnimationFrame(step);setTimeout(()=>{if(state.finalShown===k)render()},left+50)}

function renderChampion(){let fs=finalScores(),tie=fs.length===2&&compareHistories(fs[0].vals,fs[1].vals)===0,lb=leaderboard();return `<div class="center"><div class="eyebrow">The Pointless Challenge · Results</div><h1 class="hero gold">${tie?'IT’S A TIE!':'CHAMPION!'}</h1><div class="panel" style="max-width:820px;margin:20px auto"><div style="font-size:3rem">🏆</div><h2 class="question">${tie?esc(fs.map(x=>x.p.name).join(' & ')):esc(fs[0]?.p.name)}</h2><p class="sub">${tie?'Both finalists produced the same scores. Joint champions, or run a tie-break question.':'The lowest final answer wins!'}</p><div class="leader-grid mt">${fs.map(({p,vals})=>`<div class="leader-item"><strong>${esc(p.name)}</strong><div class="value">${vals[0]}</div><div class="tiny">Best final answer · others ${vals[1]}, ${vals[2]}</div></div>`).join('')}</div>

 if(['collect','review','reveal'].includes(p)){rows=leaderboard().map(pl=>{let raw=state.answers[pl.id]?.a;let r=p==='reveal'?state.results[pl.id]:resultFor(qq,raw,state.rulings);if(!raw&&p!=='reveal')return '';return `<tr><td>${esc(pl.name)}</td><td>${esc(r.none?'—':r.raw||r.a)}${r.known&&r.raw&&norm(r.raw)!==norm(r.a)?` <span class="tiny">→ ${esc(r.a)}</span>`:''}</td><td>${r.s}</td></tr>`}).join('')}

 let c=clock(),b=$('bigTimer');if(b){b.textContent=c;b.classList.toggle('urgent',state.timerRunning&&state.seconds>0&&state.seconds<=5);b.classList.toggle('done',state.seconds===0)}let tb=$('bigTimerBtn');if(tb)tb.textContent=state.timerRunning?'❚❚ Pause':'▶ Start timer'}
let lastViewKey='',seenChips=new Set();

function handleAction(a,el){if(MODE!=='host')return;switch(a){
 case 'openLobby':openLobby();break;
 case 'backSetup':change(()=>{state.phase='setup'});break;
 case 'addManual':{let n=$('manualName')?.value;if(!cleanName(n))return toast('Type a name first');change(()=>{addPlayer(n,{manual:true})},{undo:false});break}
 case 'startGame':if(!active().length)return toast('Wait for at least one player');change(()=>startQuestion());break;
 case 'timerToggle':timerToggle();break;case 'timerReset':resetTimer();break;
 case 'closeAnswers':closeAnswers();break;case 'reopen':reopenAnswers();break;
 case 'swapQ':swapModal();break;
 case 'saveEntry':{let id=$('entryFor')?.value,v=($('entryVal')?.value||'').trim();if(!id)return;if(!v)return toast('Enter an answer first');change(()=>{state.answers[id]={a:v.slice(0,60),at:Date.now()};let nxt=active().find(p=>p.manual&&!state.answers[p.id]);state._entryFor=nxt?nxt.id:id},{undo:false});toast('Answer saved');break}
 case 'startReveal':startReveal();break;case 'revealPause':revealPause();break;case 'revealSkip':revealSkip();break;
 case 'standings':change(()=>{state.phase='standings'});break;
 case 'nextQ':nextQuestion();break;case 'toFinal':toFinal();break;case 'startFinal':startFinal();break;
 case 'saveFinalTyped':case 'lockFinal':{let qq=currentQ(),bad=false;state.finalists.forEach(id=>{let vals=[0,1,2].map(j=>(document.querySelector(`[data-final-input="${id}-${j}"]`)?.value||'').trim());if(vals.some(Boolean)){let cur=state.finalAnswers[id]||['','',''];let merged=[0,1,2].map(j=>vals[j]||cur[j]||'');let keys=merged.filter(Boolean).map(v=>norm(findAnswer(qq,v)?.a||v));if(new Set(keys).size!==keys.length){toast(`${byId(id).name}: answers must be different`);bad=true;return}state.finalAnswers[id]=merged}});if(bad)return;persist();if(a==='lockFinal')lockFinal();else{render();toast('Saved')}break}
 case 'startFinalReveal':startFinalReveal();break;case 'finalBack':change(()=>{state.phase='finalcollect';state.fopen=true});break;
 case 'finalNext':finalNext();break;case 'finalBoard':change(()=>{state.phase='finalboard'});break;
 case 'champion':change(()=>{state.phase='champion'});sound('zero');break;
 case 'openDisplay':closeModal();openDisplay();break;case 'players':playersModal();break;case 'answerKey':answerKey();break;
 case 'undo':undo();break;case 'close':closeModal();break;
 case 'resetAsk':openModal(`<h2 class="section-title">Restart?</h2><p class="help">Keep the same players and game code (phones stay connected), or clear everything.</p><div class="controls">${btn('Restart · keep players','resetKeep','primary')}${btn('Clear everything','resetAll','danger')}${btn('Cancel','close','ghost')}</div>`);break;
 case 'resetKeep':resetGame(true);break;case 'resetAll':resetGame(false);break;
}}
function hostEvents(){
 document.addEventListener('click',e=>{if(MODE!=='host')return;let b=e.target.closest('[data-action]');if(b&&!b.disabled){handleAction(b.dataset.action,b);return}
  let len=e.target.closest('[data-len]');if(len){change(()=>{state.settings.length=+len.dataset.len},{undo:false});return}
  let rm=e.target.closest('[data-remove]');if(rm){let p=byId(rm.dataset.remove);if(p&&confirm(`Remove ${p.name} from the game?`)){removePlayer(p.id);if(!$('modalbg').classList.contains('hidden'))playersModal()}return}
  let rn=e.target.closest('[data-rename]');if(rn){let p=byId(rn.dataset.rename);let n=p&&cleanName(prompt('New name',p.name));if(n){change(()=>{p.name=n},{undo:false});playersModal()}return}

  if(t.matches('[data-cat]')){change(()=>{let c=t.dataset.cat,s=state.settings;s.cats=t.checked?CATS.filter(x=>x===c||s.cats.includes(x)):s.cats.filter(x=>x!==c)},{undo:false});return}

  if(t.matches('[data-rule-score]')){let rs=t.dataset.final==='1'?state.finalRulings:state.rulings,k=t.dataset.ruleScore;let n=Math.max(0,Math.min(100,parseInt(t.value,10)||0));rs[k]={mode:'accept',s:n};persist();render();return}});
 document.addEventListener('keydown',e=>{if(MODE!=='host')return;if(e.key==='Enter'&&e.target.id==='manualName'){e.preventDefault();handleAction('addManual')}if(e.key==='Enter'&&e.target.id==='entryVal'){e.preventDefault();handleAction('saveEntry')}if(e.key==='Escape')closeModal()});

//  DISPLAY MODE
// =====================================================================
function displayInit(){document.title='Pointless Challenge · Audience display';document.body.classList.add('display');$('app').innerHTML='<div class="center" style="padding:80px 0"><div class="hero gold">Pointless</div><p class="sub">Waiting for the host window…</p></div>';
 window.addEventListener('message',e=>{let d=e.data;if(!d||d.type!=='pointless-state')return;try{let inc=JSON.parse(d.json);if(!inc||!inc.players)return;dispNet=inc._net;dispJoin=inc._join;dispLocal=inc._local;delete inc._net;delete inc._join;delete inc._local;let {seconds,timerRunning,revealStep,...rest}=inc;let sig=JSON.stringify(rest)+JSON.stringify(dispNet);let prevStep=state.revealStep;state={...initial(),...inc};if(sig!==lastSig){lastSig=sig;render()}else{updateHeader();if(state.phase==='reveal'&&revealStep!==prevStep)syncBoard(true)}}catch(err){}});
 let hello=()=>{try{window.opener&&window.opener.postMessage({type:'pointless-hello'},'*')}catch(e){}};hello();setInterval(hello,2000)}

// =====================================================================
//  PLAYER MODE (phones)
// =====================================================================
const ps={status:'join',view:null,err:'',code:'',name:'',pid:'',draft:'',draft3:['','',''],sentFlash:0,stage:'server'};
let ppeer=null,pconn=null,pRetry=null,pTries=0;
function pLoad(){try{let s=JSON.parse(localStorage.getItem(PSTORE))||{};ps.pid=s.pid||'';ps.name=s.name||'';if(s.code&&!P.get('join'))ps.code=s.code}catch(e){}if(!ps.pid)ps.pid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);ps.code=(P.get('join')||ps.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)}
function pSave(){try{localStorage.setItem(PSTORE,JSON.stringify({pid:ps.pid,name:ps.name,code:ps.code,turn:turnSettings()}))}catch(e){}}
function pConnect(){if(typeof Peer==='undefined'){ps.status='error';ps.err='Couldn’t load the game. Check your internet connection and refresh.';return renderPlayer()}
 ps.status=ps.view?'reconnecting':'connecting';renderPlayer();clearTimeout(pRetry);
 let go=()=>{ps.stage='host';renderPlayer();try{pconn&&pconn.close()}catch(e){}pconn=ppeer.connect(PEER_PREFIX+ps.code,{reliable:true});let opened=false;
  let to=setTimeout(()=>{if(!opened){try{pconn.close()}catch(e){}pRetryLater()}},20000);
  pconn.on('open',()=>{opened=true;clearTimeout(to);pTries=0;pconn.send({t:'hello',pid:ps.pid,name:ps.name})});
  pconn.on('data',onHostData);pconn.on('close',()=>{if(ps.status!=='kicked')pRetryLater()});pconn.on('error',()=>pRetryLater())};
 if(ppeer&&!ppeer.destroyed&&ppeer.open)return go();
 ps.stage='server';try{ppeer&&ppeer.destroy()}catch(e){}ppeer=new Peer(undefined,peerOptions());
 ppeer.on('open',go);
 ppeer.on('error',e=>{if(e.type==='peer-unavailable'){if(!ps.view){ps.status='join';ps.err=`No game found with code ${ps.code}. Check the code on the screen.`;renderPlayer();return}pRetryLater();return}pRetryLater()});
 ppeer.on('disconnected',()=>{try{ppeer.reconnect()}catch(e){}})}
function pRetryLater(){if(ps.status==='kicked'||ps.status==='join')return;ps.status=ps.view?'reconnecting':'connecting';renderPlayer();clearTimeout(pRetry);pTries++;pRetry=setTimeout(()=>{if(pTries>6){try{ppeer&&ppeer.destroy()}catch(e){}ppeer=null}pConnect()},Math.min(8000,1500+pTries*1000))}
function onHostData(d){if(!d||typeof d!=='object')return;
 if(d.t==='view'){if(d.v.kicked){ps.status='kicked';renderPlayer();return}let sig=JSON.stringify({...d.v,seconds:0,run:0});if(sig===ps.sig&&ps.status==='in'){ps.view.seconds=d.v.seconds;ps.view.run=d.v.run;return}ps.sig=sig;let prevQ=ps.view?.q?.id,prevPhase=ps.view?.phase;ps.view=d.v;ps.status='in';ps.err='';if(d.v.q&&d.v.q.id!==prevQ)ps.draft='';if(d.v.phase==='finalcollect'&&prevPhase!=='finalcollect')ps.draft3=(d.v.my3||[]).concat(['','','']).slice(0,3);renderPlayer()}
 else if(d.t==='tick'){if(ps.view){ps.view.seconds=d.s;ps.view.run=d.run;let t=$('ptimer');if(t){t.textContent=pClock();t.classList.toggle('urgent',d.s<=5)}}}
 else if(d.t==='kicked'){ps.status='kicked';renderPlayer()}
 else if(d.t==='err'){if(ps.status!=='in'){ps.status='join';ps.err=d.msg;try{pconn.close()}catch(e){}renderPlayer()}else toast(d.msg)}}
const pClock=()=>{let s=ps.view?.seconds??0;return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function pSend(m){try{if(pconn&&pconn.open){pconn.send(m);return true}}catch(e){}toast('Not connected · trying again');pRetryLater();return false}
function renderPlayer(){document.body.classList.add('player');let ha=$('headActions');if(ha)ha.innerHTML=ps.status==='in'?`<span class="netpill">● ${esc(ps.view?.name||'')}</span>`:ps.status==='reconnecting'?'<span class="netpill bad">Reconnecting…</span>':'';
 let a=document.activeElement,keepFocus=a&&a.id,v=ps.view,app=$('app');let h='';
 if(ps.status==='join'||ps.status==='error'){h=`<div class="pcard"><div class="eyebrow">Join the game</div><h1 class="pq" style="font-size:1.8rem">Pointless Challenge</h1>${ps.err?`<div class="warn mb">${esc(ps.err)}</div>`:''}<label class="eyebrow" for="pName">Your name</label><input id="pName" maxlength="18" autocomplete="nickname" placeholder="First name + initial" value="${esc(ps.name)}"><label class="eyebrow" for="pCode" style="display:block;margin-top:14px">Game code</label><input id="pCode" maxlength="5" autocapitalize="characters" placeholder="ABCDE" value="${esc(ps.code)}" style="text-transform:uppercase;letter-spacing:.2em;font-weight:900"><button class="primary mt" id="pJoin" style="width:100%">Join →</button><p class="tiny mt">Use your real first name so the host knows who you are.</p></div>`}
 else if(ps.status==='connecting'){h=`<div class="pcard center"><div class="eyebrow">Connecting${pTries?` · try ${pTries+1}`:''}</div><p class="sub">${ps.stage==='server'?`Reaching the game server…`:`Found game ${esc(ps.code)} ✓<br>Linking to the teacher’s laptop…`}</p><p class="tiny">${turnSettings()?'Relay: on':'Relay: off'}</p></div>${pTries>=1?`<div class="pcard"><p class="help"><strong>Taking a while?</strong> ${ps.stage==='server'?'Your phone can’t reach the game server. Check you’re online (try turning Wi-Fi off to use mobile data, or back on).':'Your phone found the game but the network is blocking the link to the laptop. Tell your teacher. Joining the same Wi-Fi as the laptop can help.'}</p><button class="ghost" id="pCancel" style="width:100%">← Back</button></div>`:''}`}
 else if(ps.status==='kicked'){h=`<div class="pcard center"><div class="eyebrow">Removed</div><p class="sub">The host removed you from this game.</p><button class="ghost mt" id="pRejoin">Join again</button></div>`}
 else if(v){h=pScreen(v)}else h=`<div class="pcard center"><p class="sub">Reconnecting…</p></div>`;
 app.innerHTML=h;let inp=keepFocus&&$(keepFocus);if(inp&&inp.tagName==='INPUT'){inp.focus();try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}}}
function pScoreCard(v){let r=v.result;if(!r)return '';return `<div class="pcard center"><div class="eyebrow">Your answer</div><div class="pq" style="margin:6px 0">${r.none?'No answer':esc(r.a)}</div><div class="pbig ${r.s===0?'zero':r.s>=100?'wrong':''}">${r.s}</div><p class="sub">${r.s===0?'POINTLESS! ★':r.s>=100?(r.none?'No answer · 100 points':'Not on the list · 100 points'):'points'}</p></div>`}
function pStats(v){return `<div class="pstat"><div>Total<b>${v.total}</b></div><div>Rank<b>${ord(v.rank)}</b><span class="tiny">of ${v.count}</span></div></div>${v.stars?`<p class="center mt">${'<span class="star" style="font-size:1.4rem">★</span>'.repeat(v.stars)}</p>`:''}`}
function pScreen(v){let p=v.phase,top=`<div class="row between mb"><span class="eyebrow">${v.q||['standings'].includes(p)?`Question ${v.n} of ${v.of}`:isFinalP(p)?'Grand Final':'Pointless'}</span>${(p==='collect'&&v.open)||(p==='finalcollect'&&v.fopen)?`<span class="ptimer ${v.seconds<=5?'urgent':''}" id="ptimer">${pClock()}</span>`:''}</div>`;
 if(p==='lobby')return `<div class="pcard center"><div class="eyebrow">You’re in!</div><div class="pq" style="font-size:1.8rem">${esc(v.name)}</div><p class="sub">${v.count} player${v.count===1?'':'s'} joined. Watch the screen. The game starts soon.</p></div><div class="pcard"><p class="help"><strong>How it works:</strong> answer each question here. Find a correct answer few people would think of. <strong>Lowest score wins.</strong></p></div>`;
 if(p==='collect'&&v.q){let q=v.q;if(v.open){let body=q.format==='multi'?`<div class="popt">${q.options.map(o=>`<button data-opt="${esc(o)}" class="${o===v.my?'sel':''}">${esc(o)}</button>`).join('')}</div>`:`<input id="pAns" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" value="${esc(ps.draft||'')}"><button class="primary mt" id="pSend" style="width:100%">${v.my?'Change answer':'Send answer'}</button>`;return `${top}<div class="pcard"><span class="tag">${esc(q.cat)}</span><div class="pq">${esc(q.prompt)}</div>${body}${v.my?`<div class="sent">✓ Sent: ${esc(v.my)}<div class="tiny" style="color:#9fdcc6">You can change it until time runs out.</div></div>`:''}</div>`}
  return `${top}<div class="pcard center"><div class="eyebrow">Answers closed</div><p class="sub">${v.my?`Your answer: <strong>${esc(v.my)}</strong>`:'You didn’t answer this one (100 points).'}</p></div>`}
 if(p==='review'||(p==='reveal'&&!v.result))return `${top}<div class="pcard center"><div class="eyebrow">Look at the big screen!</div><p class="sub">${v.my?`Your answer: <strong>${esc(v.my)}</strong>`:'No answer this time.'}</p><p class="help">Your score appears here when the board finishes.</p></div>`;
 if(p==='reveal'||p==='standings')return `${top}${pScoreCard(v)}<div class="pcard">${pStats(v)}</div>`;
 if(p==='finalists')return `<div class="pcard center"><div class="eyebrow">Grand Final</div><p class="sub">Finalists:</p><div class="pq">${esc((v.finalists||[]).join(' vs '))}</div>${v.finalist?'<p class="sub gold"><strong>That’s you! Get ready.</strong></p>':''}</div><div class="pcard">${pStats(v)}</div>`;
 if(p==='finalcollect'&&v.finalist){if(!v.fopen)return `<div class="pcard center"><p class="sub">Answers locked. Watch the screen!</p></div>`;let sent=(v.my3||[]).filter(Boolean).length===3;return `${top}<div class="pcard"><div class="eyebrow">You’re in the final!</div><div class="pq">${esc(v.fq)}</div>${[0,1,2].map(i=>`<input class="mb" id="pF${i}" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Answer ${i+1}" value="${esc(ps.draft3[i]||'')}">`).join('')}<button class="primary" id="pSend3" style="width:100%">${sent?'Update my answers':'Send my 3 answers'}</button>${sent?`<div class="sent">✓ Sent: ${v.my3.map(esc).join(' · ')}</div>`:''}</div>`}
 if(isFinalP(p))return `<div class="pcard center"><div class="eyebrow">Grand Final</div><p class="sub">${p==='champion'?'':'Watch the big screen!'}</p>${p==='champion'?`<div style="font-size:3rem">🏆</div><div class="pq">${esc(v.winner||'')}</div><p class="sub">${v.finalist?'Well played in the final!':'Thanks for playing!'}</p>`:`<div class="pq">${esc((v.finalists||[]).join(' vs '))}</div>`}</div><div class="pcard">${pStats(v)}</div>`;
 return `<div class="pcard center"><p class="sub">Waiting for the host…</p></div>`}
const isFinalP=p=>p.startsWith('final')||p==='champion';
function playerInit(){pLoad();document.title='Join · Pointless Challenge';renderPlayer();if(ps.name&&ps.code)pConnect();
 document.addEventListener('click',e=>{let t=e.target;
  if(t.closest('#pJoin')){let n=cleanName($('pName').value),c=$('pCode').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!n){ps.err='Please enter your name.';return renderPlayer()}if(c.length!==5){ps.err='The game code has 5 characters.';ps.name=n;return renderPlayer()}if(c!==ps.code||n!==ps.name){/* new game or name: new identity */if(c!==ps.code)ps.pid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}ps.name=n;ps.code=c;ps.err='';pSave();pTries=0;pConnect();return}
  if(t.closest('#pCancel')){clearTimeout(pRetry);try{ppeer&&ppeer.destroy()}catch(e){}ppeer=null;ps.status='join';pTries=0;renderPlayer();return}
  if(t.closest('#pRejoin')){ps.pid='p'+Math.random().toString(36).slice(2,10);ps.status='join';ps.view=null;pSave();renderPlayer();return}
  let o=t.closest('[data-opt]');if(o&&ps.view?.open){if(pSend({t:'answer',qid:ps.view.q.id,a:o.dataset.opt})){document.querySelectorAll('[data-opt]').forEach(b=>b.classList.toggle('sel',b===o));if(navigator.vibrate)navigator.vibrate(30)}return}
  if(t.closest('#pSend')){let a=($('pAns')?.value||'').trim();if(!a)return toast('Type an answer first');if(pSend({t:'answer',qid:ps.view.q.id,a})){ps.draft='';$('pAns').blur();if(navigator.vibrate)navigator.vibrate(30)}return}
  if(t.closest('#pSend3')){let a=[0,1,2].map(i=>($('pF'+i)?.value||'').trim());if(a.some(x=>!x))return toast('Fill in all three answers');if(new Set(a.map(norm)).size<3)return toast('Your three answers must be different');ps.draft3=a;pSend({t:'final',a});return}});
 document.addEventListener('input',e=>{if(e.target.id==='pAns')ps.draft=e.target.value;let m=/^pF(\d)$/.exec(e.target.id||'');if(m)ps.draft3[+m[1]]=e.target.value});
 document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='pAns'){e.preventDefault();$('pSend')?.click()}else if(e.target.id==='pName'||e.target.id==='pCode'){e.preventDefault();$('pJoin')?.click()}}});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ps.status!=='join'&&ps.status!=='kicked'&&(!pconn||!pconn.open))pConnect()})}

// =====================================================================
//  BOOT
// =====================================================================
if(MODE==='player')playerInit();
else if(MODE==='display'){displayInit();}
else{hostEvents();render();if(state.phase!=='setup')startHostPeer();if(state.phase==='reveal'&&state.revealPlaying)scheduleReveal()}
</script>
</body></html>
